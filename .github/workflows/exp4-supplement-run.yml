name: Experiment 4 Supplement Run

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  run-supplement:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tensorflow-cpu==2.16.1 scikit-learn pandas matplotlib nbformat nbconvert ipykernel
      - name: Execute supplement
        if: ${{ hashFiles('Experiment_4_Supplement.ipynb') != '' }}
        run: |
          jupyter nbconvert --to notebook --execute Experiment_4_Supplement.ipynb \
            --output Experiment_4_Supplement_Executed.ipynb \
            --ExecutePreprocessor.timeout=5400 \
            --ExecutePreprocessor.kernel_name=python3
      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiment-4-supplement-results
          path: |
            Experiment_4_Supplement.ipynb
            Experiment_4_Supplement_Executed.ipynb
            supplement_outputs/
          if-no-files-found: warn
          retention-days: 7
