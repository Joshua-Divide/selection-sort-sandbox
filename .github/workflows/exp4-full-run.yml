name: Experiment 4 Full Run

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  run-experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tensorflow-cpu==2.16.1 scikit-learn pandas matplotlib nbformat nbconvert ipykernel
      - name: Execute notebook
        run: |
          mkdir -p outputs
          jupyter nbconvert --to notebook --execute Experiment_4_Full.ipynb \
            --output Experiment_4_Full_Executed.ipynb \
            --ExecutePreprocessor.timeout=10800 \
            --ExecutePreprocessor.kernel_name=python3
      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiment-4-full-results
          path: |
            Experiment_4_Full.ipynb
            Experiment_4_Full_Executed.ipynb
            outputs/
          if-no-files-found: warn
          retention-days: 7
