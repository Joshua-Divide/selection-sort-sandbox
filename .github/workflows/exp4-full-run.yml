name: Experiment 4 Full Run

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  run-experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tensorflow-cpu==2.16.1 scikit-learn pandas matplotlib nbformat nbconvert ipykernel
      - name: Use controlled comparison subset
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('Experiment_4_Full.ipynb')
          s = p.read_text()
          s = s.replace('train_size=10000', 'train_size=3000')
          s = s.replace('train_size=2000, random_state=SEED, stratify=y_val', 'train_size=600, random_state=SEED, stratify=y_val')
          s = s.replace('train_size=2000, random_state=SEED, stratify=y_test', 'train_size=1000, random_state=SEED, stratify=y_test')
          s = s.replace('def train_scratch(name, builder, epochs=3):', 'def train_scratch(name, builder, epochs=2):')
          s = s.replace('epochs_frozen=3, epochs_ft=1', 'epochs_frozen=1, epochs_ft=1')
          p.write_text(s)
          PY
      - name: Execute notebook
        run: |
          mkdir -p outputs
          jupyter nbconvert --to notebook --execute Experiment_4_Full.ipynb \
            --output Experiment_4_Full_Executed.ipynb \
            --ExecutePreprocessor.timeout=10800 \
            --ExecutePreprocessor.kernel_name=python3
      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiment-4-full-results
          path: |
            Experiment_4_Full.ipynb
            Experiment_4_Full_Executed.ipynb
            outputs/
          if-no-files-found: warn
          retention-days: 7
