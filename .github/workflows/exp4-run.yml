name: Experiment 4 Transfer Learning Run

on:
  push:
    branches: [exp4-fast-20260820]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  run-experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tensorflow-cpu==2.16.1 scikit-learn pandas matplotlib
      - name: Load complete benchmark script
        run: curl -fsSL https://raw.githubusercontent.com/Joshua-Divide/selection-sort-sandbox/exp4-complete-20260820/exp4_quick.py -o exp4_quick.py
      - name: Execute complete benchmark
        run: python exp4_quick.py
      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiment-4-complete-results-quick
          path: outputs_complete/
          if-no-files-found: warn
          retention-days: 7
